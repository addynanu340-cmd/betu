
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You Bubu ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(circle, #351020, #10030b 75%);
    font-family: 'Poppins', sans-serif;
    color: white;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 500px;
    padding: 25px 15px;
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff719d;
    margin-bottom: 25px;
    font-size: 28px;
}

.subtitle {
    color: #ffd6e4;
    margin-bottom: 25px;
    font-size: 14px;
}

/* ENVELOPE */

.envelope {
    width: 220px;
    height: 145px;
    position: relative;
    margin: 50px auto 35px;
    background: #ff6b91;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 30px #ff174877;
    transition: transform 0.4s;
}

.envelope:hover {
    transform: scale(1.05);
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: #ff8eaa;
    z-index: 2;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}

.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #ffb0c4;
    clip-path: polygon(0 0, 50% 55%, 100% 0);
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ff4d7d;
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    transform-origin: top;
    transition: transform 0.7s;
    z-index: 4;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.letter {
    position: absolute;
    width: 88%;
    height: 115px;
    background: #fff0f4;
    color: #b51648;
    left: 6%;
    top: 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.7;
    transition: transform 0.8s;
    z-index: 1;
}

.envelope.open .letter {
    transform: translateY(-100px);
    z-index: 5;
}

.tap-text {
    color: #ffc0d4;
    font-size: 14px;
}

/* BUTTONS */

button {
    border: none;
    outline: none;
    padding: 12px 28px;
    margin-top: 25px;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff1744, #ff6090);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 20px #ff174455;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 30px #ff1744aa;
}

.hidden {
    display: none !important;
}

/* HEART PAGE */

.big-heart {
    font-size: 150px;
    color: #ff1744;
    cursor: pointer;
    display: inline-block;
    filter: drop-shadow(0 0 20px #ff1744);
    animation: heartbeat 1s infinite;
    user-select: none;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.12); }
    50% { transform: scale(1); }
    75% { transform: scale(1.08); }
}

.love-text {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(36px, 10vw, 55px);
    font-weight: 700;
    color: #ff8db4;
    text-shadow: 0 0 20px #ff1744;
    margin-top: 20px;
    animation: appear 1s ease;
}

.message {
    font-size: 20px;
    line-height: 1.8;
    color: #ffd7e5;
    margin-top: 25px;
    animation: appear 1s ease;
}

.arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 55px;
    height: 55px;
    margin-top: 30px;
    border-radius: 50%;
    background: #ff1744;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 0 25px #ff174477;
    transition: 0.3s;
}

.arrow:hover {
    transform: translateX(8px);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FLOATING HEARTS */

.floating-heart {
    position: fixed;
    bottom: -30px;
    color: #ff477e;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 6s linear forwards;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.8; }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1: ENVELOPE -->
    <section id="page1">
        <h1>💌 A Letter For You 💌</h1>
        <p class="subtitle">Someone special is waiting for you...</p>

        <div class="envelope" id="envelope" onclick="openEnvelope()">
            <div class="letter">
                Tum ho to sb mera,<br>
                jo tum nahi to mai bhi na mera ❤️
            </div>
            <div class="envelope-body"></div>
            <div class="flap"></div>
        </div>

        <p class="tap-text" id="tapText">Tap the envelope to open ❤️</p>

        <button id="seeButton" class="hidden" onclick="showHeart()">
            See Another ❤️
        </button>
    </section>

    <!-- PAGE 2: HEART -->
    <section id="page2" class="hidden">
        <h1>For My Bubu ❤️</h1>

        <div class="big-heart" onclick="showLove()">
            ❤️
        </div>

        <p class="subtitle">Tap the heart, my love 💗</p>

        <h2 id="loveText" class="love-text hidden">
            Love You Bubu
        </h2>

        <div>
            <span class="arrow" onclick="showFinal()" title="Next">
                ➜
            </span>
        </div>
    </section>

    <!-- PAGE 3: FINAL MESSAGE -->
    <section id="page3" class="hidden">
        <div class="big-heart">❤️</div>

        <h1 class="love-text">Your Betu</h1>

        <p class="message">
            Love You So Much 🥹❤️<br>
            You are my everything, Bubu! 💋<br>
            Forever Yours ♾️
        </p>

        <button onclick="restart()">Read Again 💌</button>
    </section>

</div>

<script>
let opened = false;

function openEnvelope() {
    if (opened) return;

    opened = true;

    document.getElementById("envelope")
        .classList.add("open");

    document.getElementById("tapText").textContent =
        "A little message, just for you ❤️";

    setTimeout(() => {
        document.getElementById("seeButton")
            .classList.remove("hidden");
    }, 900);

    createHearts();
}

function showHeart() {
    document.getElementById("page1")
        .classList.add("hidden");

    document.getElementById("page2")
        .classList.remove("hidden");

    createHearts();
}

function showLove() {
    document.getElementById("loveText")
        .classList.remove("hidden");

    createHearts();
}

function showFinal() {
    document.getElementById("page2")
        .classList.add("hidden");

    document.getElementById("page3")
        .classList.remove("hidden");

    createHearts();
}

function restart() {
    document.getElementById("page3")
        .classList.add("hidden");

    document.getElementById("page2")
        .classList.add("hidden");

    document.getElementById("page1")
        .classList.remove("hidden");

    document.getElementById("envelope")
        .classList.remove("open");

    document.getElementById("loveText")
        .classList.add("hidden");

    document.getElementById("seeButton")
        .classList.add("hidden");

    document.getElementById("tapText").textContent =
        "Tap the envelope to open ❤️";

    opened = false;
}

function createHearts() {
    for (let i = 0; i < 8; i++) {
        const heart = document.createElement("div");

        heart.className = "floating-heart";
        heart.textContent = Math.random() > 0.5 ? "❤️" : "💕";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration =
            (4 + Math.random() * 4) + "s";

        heart.style.fontSize =
            (15 + Math.random() * 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 8000);
    }
}

// Background heart animation
setInterval(() => {
    if (Math.random() > 0.5) createHearts();
}, 3500);
</script>

</body>
</html>
